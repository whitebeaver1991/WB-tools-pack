<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WB Pie Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="CSInterface.js"></script>
</head>
<body>
    <div class="panel">
        <div class="top-bar">
            <h2 data-lang="title">WB Menu Suite</h2>
            <div class="top-bar-right">
                <button id="scanBtn" class="btn-scan" title="Scan effects and update name map">&#128269; Scan</button>
                <button id="langBtn" class="btn-lang" title="Switch Language">中/EN</button>
                <button id="saveBtn" class="btn-save"><span>&#128426;</span> <span data-lang="save">Save</span></button>
            </div>
        </div>
        <p id="status"></p>

        <div id="zoomContent">
        <div class="tabs" id="menuTabs">
            <button class="tab active" data-menu="0" data-lang="pie">Pie</button>
            <button class="tab" data-menu="1" data-lang="quick">Quick</button>
            <button class="tab" data-menu="2" data-lang="wheel">Wheel</button>
        </div>

        <div class="section-global">
            <div class="section-row">
                <label data-lang="trigger">Trigger</label>
                <div class="hotkey-row">
                    <input id="triggerInput" type="text" readonly placeholder="Record...">
                    <button id="triggerBtn" class="btn-record" data-lang="record">Record</button>
                </div>
            </div>
            <div class="section-row">
                <label>Prev Page</label>
                <div class="hotkey-row">
                    <input id="prevPageInput" type="text" readonly placeholder="Key...">
                    <button id="prevPageBtn" class="btn-record" data-lang="record">Record</button>
                </div>
            </div>
            <div class="section-row">
                <label>Next Page</label>
                <div class="hotkey-row">
                    <input id="nextPageInput" type="text" readonly placeholder="Key...">
                    <button id="nextPageBtn" class="btn-record" data-lang="record">Record</button>
                </div>
            </div>
            <div class="section-row">
                <label data-lang="numpad">Numpad</label>
                <div class="switch-row">
                    <label class="switch">
                        <input id="numpadToggle" type="checkbox">
                        <span class="slider-round"></span>
                    </label>
                    <span class="hint" data-lang="numpadHint">F13-F22 (requires pairing)</span>
                </div>
            </div>
        </div>

        <div class="collapsible">
            <div class="collapsible-header" data-target="pieMenuSection">
                <span class="collapse-icon">&#9660;</span>
                <span data-lang="pieMenu">Pie Menu</span>
            </div>
            <div id="pieMenuSection" class="collapsible-body">
                <div class="section-row">
                    <label data-lang="winAlpha">Win Opacity</label>
                    <div class="slider-row">
                        <input id="winAlphaSlider" type="range" min="0" max="100" step="5" value="60">
                        <span id="winAlphaValue" class="slider-value">60</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="bgAlpha">Bg Alpha</label>
                    <div class="slider-row">
                        <input id="bgAlphaSlider" type="range" min="0" max="100" step="5" value="60">
                        <span id="bgAlphaValue" class="slider-value">60</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="bgColor">Bg Color</label>
                    <div class="slider-row">
                        <input id="bgColorInput" type="color" value="#2a2a2a" style="width:40px;height:30px;padding:0;border:1px solid #555;border-radius:2px;background:none;cursor:pointer;">
                        <span id="bgColorText" class="slider-value" style="font-family:Consolas;margin-left:6px;">#2A2A2A</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="glowColor">Glow Color</label>
                    <div class="slider-row">
                        <input id="glowColorInput" type="color" value="#3cb93c" style="width:40px;height:30px;padding:0;border:1px solid #555;border-radius:2px;background:none;cursor:pointer;">
                        <span id="glowColorText" class="slider-value" style="font-family:Consolas;margin-left:6px;">#3CB93C</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="glowIntensity">Glow Intensity</label>
                    <div class="slider-row">
                        <input id="glowIntensitySlider" type="range" min="0" max="200" step="5" value="100">
                        <span id="glowIntensityValue" class="slider-value">100</span>
                    </div>
                </div>
                <div class="section-row">
                    <label>Page Color</label>
                    <div class="slider-row">
                        <input id="pageColorInput" type="color" value="#78787d" style="width:40px;height:30px;padding:0;border:1px solid #555;border-radius:2px;background:none;cursor:pointer;">
                        <span id="pageColorText" class="slider-value" style="font-family:Consolas;margin-left:6px;">#78787D</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="imgDist">Icon Dist</label>
                    <div class="slider-row">
                        <input id="imgDistSlider" type="range" min="20" max="80" step="5" value="45">
                        <span id="imgDistValue" class="slider-value">45</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="textDist">Text Dist</label>
                    <div class="slider-row">
                        <input id="textDistSlider" type="range" min="30" max="90" step="5" value="85">
                        <span id="textDistValue" class="slider-value">85</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="textSize">Text Size</label>
                    <div class="slider-row">
                        <input id="textSizeSlider" type="range" min="50" max="150" step="5" value="100">
                        <span id="textSizeValue" class="slider-value">100%</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="menuScale">Menu Scale</label>
                    <div class="slider-row">
                        <input id="menuScaleSlider" type="range" min="50" max="150" step="5" value="100">
                        <span id="menuScaleValue" class="slider-value">100%</span>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="pieCount">Pie Sectors</label>
                    <div class="slider-row">
                        <select id="pieCountSelect" class="field-select">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>
                </div>
                <div class="section-row">
                    <label data-lang="quickCount">Quick Slots</label>
                    <div class="slider-row">
                        <select id="quickCountSelect" class="field-select">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6" selected>6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="collapsible">
            <div class="collapsible-header" data-target="cepSection">
                <span class="collapse-icon">&#9660;</span>
                <span data-lang="cep">CEP Panel</span>
            </div>
            <div id="cepSection" class="collapsible-body">
                <div class="section-row">
                    <label data-lang="uiZoom">UI Zoom</label>
                    <div class="slider-row">
                        <input id="uiZoomSlider" type="range" min="100" max="200" step="5" value="100">
                        <span id="uiZoomValue" class="slider-value">100</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="collapsible">
            <div class="collapsible-header collapsed" data-target="aboutSection">
                <span class="collapse-icon">&#9660;</span>
                <span data-lang="about">About</span>
            </div>
            <div id="aboutSection" class="collapsible-body collapsed" style="padding:8px;font-size:11px;color:#888;line-height:1.6;">
                 <div><b>WB Menu Suite</b> &mdash; Version 0.0.1</div>
                 <div>vibe coding作者: whitebeaver</div>
                 <div>本项目完全免费，由Trae与Deepseek V4.0 Flash版本生成，完全AI，绝无人工要素</div>
             </div>
        </div>

        <div class="section" id="menuSection">
            <div class="menu-header" id="menuHeader"></div>
            <div id="itemsContainer"></div>
        </div>

        <div id="effectSearchOverlay" class="effect-overlay" style="display:none;">
            <div class="effect-overlay-panel">
                <div class="effect-overlay-search">
                    <input id="effectSearchInput" type="text" data-lang="searchPH" placeholder="Search effects..." autocomplete="off">
                    <span id="effectSearchCount" class="effect-overlay-count"></span>
                </div>
                <div id="effectSearchResults" class="effect-overlay-results"></div>
            </div>
        </div>

        <div id="debugLogWrap" style="margin-top:8px;border:1px solid #333;border-radius:3px;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 6px;background:#1a1a1a;border-bottom:1px solid #333;">
                <span class="collapsible-header" data-target="debugLogBody" style="cursor:pointer;font-size:10px;color:#666;user-select:none;">
                    <span class="collapse-icon" style="display:inline-block;transition:transform .15s;">&#9660;</span>
                    Debug Log
                </span>
                <button id="copyLogBtn" style="font-size:10px;padding:1px 6px;background:#333;border:1px solid #555;border-radius:2px;color:#aaa;cursor:pointer;">📋 Copy</button>
            </div>
            <div id="debugLogBody" class="collapsible-body collapsed">
                <div id="debugLog" style="padding:4px 6px;font-size:10px;font-family:Consolas;color:#888;max-height:150px;overflow-y:auto;user-select:text;-webkit-user-select:text;"></div>
            </div>
        </div>
        </div>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
