<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>无限轮盘配置</title>
<script src="CSInterface.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1e1e1e; color:#ccc; font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:12px; user-select:none; padding:20px; display:flex; justify-content:center; }
.panel { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.wheel-area { text-align:center; }
.wheel-area h3 { color:#ddd; font-size:13px; margin-bottom:6px; }
canvas#wheelCanvas { border:1px solid #333; border-radius:6px; cursor:pointer; }
.controls { width:300px; display:flex; flex-direction:column; gap:8px; }
.setting-group { background:#2a2a2a; border:1px solid #333; border-radius:4px; padding:10px; }
.setting-group h4 { color:#bbb; font-size:11px; margin-bottom:6px; }
.setting-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.setting-row label { font-size:10px; color:#888; min-width:48px; }
.setting-row select, .setting-row input[type="color"] { background:#1e1e1e; border:1px solid #444; color:#ccc; padding:2px 6px; border-radius:2px; font-size:11px; }
.setting-row select { flex:1; }
.setting-row input[type="range"] { flex:1; height:4px; -webkit-appearance:none; appearance:none; background:#333; border-radius:2px; }
.setting-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#3cb93c; cursor:pointer; border:none; }
.range-val { min-width:28px; text-align:right; font-size:10px; color:#888; }
.info-box { background:#2a2a2a; border:1px solid #333; border-radius:4px; padding:10px; }
.info-box .label { color:#888; font-size:10px; }
.info-box .value { color:#eee; font-size:12px; }
.color-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px; margin-top:4px; }
.color-item { display:flex; align-items:center; gap:4px; font-size:10px; color:#888; }
.color-item input[type="color"] { width:28px; height:18px; padding:0; border:1px solid #555; border-radius:2px; background:none; cursor:pointer; }
.legend { display:flex; justify-content:center; gap:8px; margin-top:6px; font-size:10px; color:#888; flex-wrap:wrap; }
.preview-toggle { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.switch { position:relative; display:inline-block; width:30px; height:16px; }
.switch input { opacity:0; width:0; height:0; }
.sl-switch { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#444; border-radius:8px; transition:.2s; }
.sl-switch:before { content:""; position:absolute; height:12px; width:12px; left:2px; bottom:2px; background:#ccc; border-radius:50%; transition:.2s; }
.switch input:checked + .sl-switch { background:#3cb93c; }
.switch input:checked + .sl-switch:before { transform:translateX(14px); }
.band-preview { display:flex; gap:2px; height:14px; margin:6px 0 2px; border-radius:2px; overflow:hidden; }
.band-seg { display:flex; align-items:center; justify-content:center; font-size:7px; color:rgba(255,255,255,0.5); }
.btn-primary { background:#3cb93c; border:none; color:#111; padding:4px 14px; border-radius:3px; cursor:pointer; font-size:12px; font-weight:600; }
.btn-primary:hover { background:#4cc94c; }
.btn-danger { background:#b93c3c; border:none; color:#eee; padding:4px 14px; border-radius:3px; cursor:pointer; font-size:12px; font-weight:600; }
.btn-danger:hover { background:#c94c4c; }
.save-bar { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
.status-text { font-size:10px; color:#5c5; padding:4px 0; min-height:18px; text-align:right; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index:1000; }
.modal-panel { background:#2a2a2a; border:1px solid #444; border-radius:6px; width:400px; max-height:90vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #333; }
.modal-header h3 { font-size:13px; color:#ddd; }
.modal-close { background:none; border:none; color:#666; font-size:18px; cursor:pointer; }
.modal-close:hover { color:#c55; }
.modal-body { padding:10px 12px; }
.modal-footer { padding:6px 12px; border-top:1px solid #333; display:flex; justify-content:flex-end; gap:6px; }
.field-row { margin-bottom:8px; }
.field-row label { display:block; font-size:10px; color:#888; margin-bottom:2px; }
.field-row input[type="text"] { width:100%; background:#1e1e1e; border:1px solid #444; color:#ccc; padding:4px 8px; border-radius:2px; font-size:12px; }
.field-row input[type="text"]:focus { border-color:#3cb93c; outline:none; }
.field-row select { width:100%; background:#1e1e1e; border:1px solid #444; color:#ccc; padding:4px 8px; border-radius:2px; font-size:12px; }
.hotkey-row { display:flex; gap:6px; }
.btn-small { background:#333; border:1px solid #555; color:#ccc; padding:3px 8px; border-radius:2px; cursor:pointer; font-size:10px; }
.btn-small:hover { border-color:#3cb93c; }
.icon-row { display:flex; gap:6px; align-items:center; }
.icon-row input { flex:1; }
.icon-preview { width:40px; height:40px; border:1px solid #444; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:16px; color:#555; background:#1e1e1e; overflow:hidden; flex-shrink:0; }
.icon-preview img { max-width:100%; max-height:100%; }
.effect-search-wrap { position:relative; }
.effect-results { position:absolute; top:100%; left:0; right:0; background:#2a2a2a; border:1px solid #444; border-top:none; max-height:150px; overflow-y:auto; display:none; z-index:10; }
.effect-item { padding:3px 8px; cursor:pointer; font-size:11px; }
.effect-item:hover { background:#3a3a3a; color:#fff; }
.effect-item .match { color:#888; font-size:9px; margin-left:6px; }
.slider-row { display:flex; align-items:center; gap:6px; }
.slider-row input[type="range"] { flex:1; height:4px; -webkit-appearance:none; appearance:none; background:#333; border-radius:2px; }
.slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#3cb93c; cursor:pointer; border:none; }
</style>
</head><body>
<div class="panel">
  <div class="wheel-area">
    <h3>无限轮盘 <span id="slotCountLabel" style="color:#888;font-size:11px;"></span></h3>
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
    <div class="legend">
      <span><span style="display:inline-block;width:10px;height:10px;background:#3a6a3a;border-radius:2px;"></span> R1</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#8a7a3a;border-radius:2px;"></span> R2</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#3a5a7a;border-radius:2px;"></span> R3</span>
      <span style="color:#666;" id="widthDetail"></span>
    </div>
    <div class="band-preview" id="bandPreview"></div>
    <div class="status-text" id="statusText"></div>
  </div>

  <div class="controls">
    <div class="setting-group">
      <h4>扇区与切分</h4>
      <div class="setting-row"><label>扇区数</label><select id="splitSectors"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option></select></div>
      <div class="setting-row"><label>R2 切分</label><select id="splitR2"><option value="2a">角度 2</option><option value="2r">径向 2</option></select></div>
      <div class="setting-row"><label>R3 切分</label><select id="splitR3"><option value="2">角度 2</option><option value="3" selected>角度 3</option></select></div>
    </div>

    <div class="setting-group">
      <h4>环形边界</h4>
      <div class="setting-row">
        <label>死区 DZ</label>
        <input type="range" id="sDz" min="6" max="45" value="20">
        <span class="range-val" id="vDz">20</span>
      </div>
      <div class="setting-row">
        <label>R1 →</label>
        <input type="range" id="sR1" min="30" max="130" value="80">
        <span class="range-val" id="vR1">80</span>
      </div>
      <div class="setting-row">
        <label>R2 →</label>
        <input type="range" id="sR2" min="60" max="165" value="140">
        <span class="range-val" id="vR2">140</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:#555;margin-top:2px;">
        <span>DZ</span><span>R1</span><span>R2</span><span>R3</span>
      </div>
    </div>

    <div class="setting-group">
      <h4>扇区颜色</h4>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="setting-group">
      <div class="preview-toggle">
        <label class="switch"><input type="checkbox" id="previewToggle"><span class="sl-switch"></span></label>
        <label for="previewToggle" style="font-size:10px;color:#888;cursor:pointer;">高亮预览</label>
      </div>
      <div class="info-box"><div class="label">悬停信息</div><div class="value" id="hoverDetail" style="font-size:11px;">启用预览后悬停查看</div></div>
    </div>

    <div class="save-bar">
      <button class="btn-danger" id="closeBtn">关闭</button>
      <button class="btn-primary" id="saveBtn">保存设置</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-panel">
    <div class="modal-header"><h3 id="modalTitle">编辑槽位</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-row">
        <label>槽位名称</label>
        <input type="text" id="editName" placeholder="例如：发光、模糊...">
      </div>
      <div class="field-row">
        <label>效果</label>
        <div class="effect-search-wrap">
          <input type="text" id="editEffect" placeholder="搜索效果..." autocomplete="off">
          <div class="effect-results" id="effectResults"></div>
        </div>
      </div>
      <div class="field-row">
        <label>快捷键</label>
        <div class="hotkey-row">
          <input type="text" id="editHotkey" readonly placeholder="点击录制后按按键">
          <button class="btn-small" id="editHotkeyRec">录制</button>
          <button class="btn-small" id="editHotkeyClear">清除</button>
        </div>
      </div>
      <div class="field-row">
        <label>图标路径</label>
        <div class="icon-row">
          <input type="text" id="editIcon" placeholder="PNG 文件路径...">
          <div class="icon-preview" id="editIconPreview">?</div>
        </div>
      </div>
      <div class="field-row">
        <label>字体大小 <span class="range-val" id="vFont">100%</span></label>
        <input type="range" id="editFontSize" min="50" max="200" step="10" value="100">
      </div>
      <div class="field-row">
        <label>图标大小 <span class="range-val" id="vIconSize">80%</span></label>
        <input type="range" id="editIconSize" min="20" max="200" step="10" value="80">
      </div>
      <div class="field-row">
        <label>动作类型</label>
        <select id="editAction">
          <option value="0">应用效果</option>
          <option value="1">运行脚本</option>
          <option value="2">打开链接</option>
          <option value="3">无操作</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-small" id="modalCancel" style="border-color:#555;">取消</button>
      <button class="btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script>
var g_nSectors = 8;
var g_sectorColors = ['#3a6a3a','#6a5a3a','#3a5a7a','#6a3a5a','#5a5a3a','#3a6a5a','#5a3a6a','#6a4a3a'];
var g_splitR2 = '2a', g_splitR3 = 3;
var g_preview = false;
var g_r3 = 185;
var g_rDead = 20, g_r1 = 80, g_r2 = 140;
var g_slotData = {};
var g_hoveredSlot = -1, g_hoveredSector = -1, g_selectedSlot = -1, g_recording = false;

var g_csInterface = null;
try { g_csInterface = new CSInterface(); } catch(e) {}

function evalScript(code) {
  return new Promise(function(resolve) {
    if (g_csInterface) g_csInterface.evalScript(code, function(r) { resolve(r); });
    else resolve('');
  });
}

function getRadii() {
  var d = parseInt(document.getElementById('sDz').value);
  var ra = parseInt(document.getElementById('sR1').value);
  var rb = parseInt(document.getElementById('sR2').value);
  if (d >= ra - 4) d = Math.max(6, ra - 4);
  if (ra >= rb - 4) ra = Math.max(30, rb - 4);
  if (rb >= g_r3 - 4) rb = Math.max(60, g_r3 - 4);
  return {rDead: d, r1: ra, r2: rb, r3: g_r3};
}

function getSlotCounts() {
  return [1, g_splitR2 === '2a' || g_splitR2 === '2r' ? 2 : 1, g_splitR3 === 2 ? 2 : 3];
}
function totalSlots() { var c = getSlotCounts(); return g_nSectors * (c[0] + c[1] + c[2]); }
function getSlotSector(i) { var c = getSlotCounts(); return Math.floor(i / (c[0]+c[1]+c[2])); }

function hexToHSL(h) {
  var r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h2=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h2=((g-b)/d+(g<b?6:0))/6;else if(mx===g)h2=((b-r)/d+2)/6;else h2=((r-g)/d+4)/6;}
  return {h:h2*360,s:s*100,l:l*100};
}
function hslStr(h,s,l){return 'hsl('+h+','+s+'%,'+l+'%)';}
function adjCol(hex,sMul,lMul){var h=hexToHSL(hex);h.s=Math.min(100,Math.max(0,h.s*sMul));h.l=Math.min(80,Math.max(8,h.l*lMul));return hslStr(h.h,h.s,h.l);}

function renderWheel() {
  var canvas=document.getElementById('wheelCanvas'),ctx=canvas.getContext('2d');
  var w=400,h=400,cx=200,cy=200,n=g_nSectors,slice=2*Math.PI/n;
  var counts=getSlotCounts(),per=counts[0]+counts[1]+counts[2];
  var R=getRadii();
  document.getElementById('vDz').textContent=R.rDead;
  document.getElementById('vR1').textContent=R.r1;
  document.getElementById('vR2').textContent=R.r2;
  document.getElementById('slotCountLabel').textContent='| '+n+' 扇区 \u00d7 '+per+' = '+totalSlots()+' 槽位';
  document.getElementById('widthDetail').textContent='W: '+(R.r1-R.rDead)+'/'+(R.r2-R.r1)+'/'+(R.r3-R.r2);

  var bp=document.getElementById('bandPreview');
  var total=R.r3-R.rDead;
  function seg(w2,c){var el=document.createElement('div');el.className='band-seg';el.style.flex=w2+' 0';el.style.background=c;el.textContent=w2;return el;}
  bp.innerHTML='';bp.appendChild(seg(R.r1-R.rDead,'#3a6a3a'));bp.appendChild(seg(R.r2-R.r1,'#8a7a3a'));bp.appendChild(seg(R.r3-R.r2,'#3a5a7a'));

  ctx.clearRect(0,0,w,h);ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
  var slotIdx=0,hitAreas=[];
  var rd=R.rDead,ra=R.r1,rb=R.r2,rc=R.r3;

  for(var s=0;s<n;s++){
    var base=g_sectorColors[s],a0=-Math.PI/2+s*slice,a1=a0+slice,midA=a0+slice/2;
    var sSt='normal';
    if(g_preview){if(g_hoveredSlot>=0)sSt=getSlotSector(g_hoveredSlot)===s?'active':'dim';else if(g_hoveredSector>=0)sSt=g_hoveredSector===s?'active':'dim';}
    function pick(isH){
      if(!g_preview)return adjCol(base,1,1);
      if(isH)return adjCol(base,1.7,1.6);
      if(sSt==='dim')return adjCol(base,0.3,0.4);
      if(sSt==='active')return adjCol(base,1.3,1.2);
      return adjCol(base,1,1);
    }
    (function(){var c=pick(g_hoveredSlot===slotIdx);
      ctx.beginPath();ctx.arc(cx,cy,ra,a0,a1);ctx.arc(cx,cy,rd,a1,a0,true);ctx.closePath();
      ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.stroke();
      hitAreas.push({s:s,ri:0,su:0,a0:a0,a1:a1,r0:rd,r1:ra});slotIdx++;})();
    if(g_splitR2==='2a'){
      var ha=slice/2;
      for(var su=0;su<2;su++){var sa0=a0+ha*su,sa1=a0+ha*(su+1);var c=pick(g_hoveredSlot===slotIdx);
        ctx.beginPath();ctx.arc(cx,cy,rb,sa0,sa1);ctx.arc(cx,cy,ra,sa1,sa0,true);ctx.closePath();
        ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.stroke();
        hitAreas.push({s:s,ri:1,su:su,a0:sa0,a1:sa1,r0:ra,r1:rb});slotIdx++;}
      ctx.beginPath();ctx.moveTo(cx+Math.cos(midA)*ra,cy+Math.sin(midA)*ra);ctx.lineTo(cx+Math.cos(midA)*rb,cy+Math.sin(midA)*rb);
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
    } else {
      var mr=(ra+rb)/2;
      for(var su=0;su<2;su++){var sr0=su===0?ra:mr,sr1=su===0?mr:rb;var c=pick(g_hoveredSlot===slotIdx);
        ctx.beginPath();ctx.arc(cx,cy,sr1,a0,a1);ctx.arc(cx,cy,sr0,a1,a0,true);ctx.closePath();
        ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.stroke();
        hitAreas.push({s:s,ri:1,su:su,a0:a0,a1:a1,r0:sr0,r1:sr1});slotIdx++;}
    }
    var sn=slice/g_splitR3;
    for(var su=0;su<g_splitR3;su++){var sa0=a0+sn*su,sa1=a0+sn*(su+1);var c=pick(g_hoveredSlot===slotIdx);
      ctx.beginPath();ctx.arc(cx,cy,rc,sa0,sa1);ctx.arc(cx,cy,rb,sa1,sa0,true);ctx.closePath();
      ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.stroke();
      hitAreas.push({s:s,ri:2,su:su,a0:sa0,a1:sa1,r0:rb,r1:rc});slotIdx++;}
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a0)*rd,cy+Math.sin(a0)*rd);ctx.lineTo(cx+Math.cos(a0)*rc,cy+Math.sin(a0)*rc);
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.stroke();
  }
  [ra,rb].forEach(function(r){ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.stroke();});
  ctx.beginPath();ctx.arc(cx,cy,rd,0,2*Math.PI);ctx.fillStyle='#1a1a1a';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(n+'\u00d7'+per+'='+totalSlots(),cx,cy);
  window._hitAreas=hitAreas;
}

function hitTest(mx,my){var cx=200,cy=200,dx=mx-cx,dy=my-cy,dist=Math.sqrt(dx*dx+dy*dy);
  var angle=Math.atan2(dy,dx);if(angle<-Math.PI/2)angle+=2*Math.PI;
  var areas=window._hitAreas||[];for(var i=0;i<areas.length;i++){var a=areas[i];
    if(dist>=a.r0-0.001&&dist<=a.r1+0.001&&angle>=a.a0-0.001&&angle<=a.a1+0.001)return{slot:i,sector:a.s};}return null;}

function buildColorGrid(){var grid=document.getElementById('colorGrid');grid.innerHTML='';
  for(var s=0;s<g_nSectors;s++){var div=document.createElement('div');div.className='color-item';
    div.innerHTML='<span>S'+(s+1)+'</span>';var inp=document.createElement('input');inp.type='color';inp.value=g_sectorColors[s];
    inp.addEventListener('input',function(idx){return function(){g_sectorColors[idx]=this.value;if(!g_preview)renderWheel();};}(s));
    div.appendChild(inp);grid.appendChild(div);}}

var allEffects = [
  {name:'CC Glass', match:'ADBE CC Glass'},
  {name:'Curves', match:'ADBE Curves Custom'},
  {name:'Glow', match:'ADBE Glow2'},
  {name:'Drop Shadow', match:'ADBE Drop Shadow'},
  {name:'Levels', match:'ADBE Levels'},
  {name:'Hue/Saturation', match:'ADBE Hue Saturation'},
  {name:'Blur (Gaussian)', match:'ADBE Gaussian Blur'},
  {name:'Directional Blur', match:'ADBE Directional Blur'},
  {name:'Radial Blur', match:'ADBE Radial Blur'},
  {name:'Fractal Noise', match:'ADBE Fractal Noise'},
  {name:'Lumetri Color', match:'ADBE Lumetri Color'},
  {name:'Colorama', match:'ADBE Colorama'},
  {name:'S_Glow', match:'Sapphire Glow'},
  {name:'S_Shake', match:'Sapphire Shake'},
  {name:'S_WarpBubble', match:'Sapphire WarpBubble'},
  {name:'S_LensFlare', match:'Sapphire LensFlare'},
  {name:'S_Rays', match:'Sapphire Rays'},
  {name:'S_Glint', match:'Sapphire Glint'},
  {name:'S_HeatDisplacement', match:'Sapphire HeatDisplacement'},
  {name:'S_KnollLight', match:'Sapphire KnollLight'},
  {name:'S_Zap', match:'Sapphire Zap'},
  {name:'S_GlowRain', match:'Sapphire GlowRain'},
  {name:'S_EdgeRays', match:'Sapphire EdgeRays'},
  {name:'S_WarpPuddle', match:'Sapphire WarpPuddle'},
  {name:'S_WarpRipple', match:'Sapphire WarpRipple'}
];
var recentEffects = [
  {name:'CC Glass', match:'ADBE CC Glass'},
  {name:'Curves', match:'ADBE Curves Custom'},
  {name:'Glow', match:'ADBE Glow2'}
];

function applySettingsFromData(data) {
  if (!data) return;
  var lines = data.split('\n');
  var parsed = {};
  lines.forEach(function(line) {
    var idx = line.indexOf('=');
    if (idx > 0) parsed[line.substring(0, idx).trim()] = line.substring(idx + 1).trim();
  });
  if (parsed['infinite_sectors']) {
    var v = parseInt(parsed['infinite_sectors']);
    if (v >= 2 && v <= 8) {
      g_nSectors = v;
      document.getElementById('splitSectors').value = v;
    }
  }
  if (parsed['infinite_split_R2']) {
    g_splitR2 = parsed['infinite_split_R2'];
    document.getElementById('splitR2').value = g_splitR2;
  }
  if (parsed['infinite_split_R3']) {
    var v = parseInt(parsed['infinite_split_R3']);
    if (v === 2 || v === 3) {
      g_splitR3 = v;
      document.getElementById('splitR3').value = v;
    }
  }
  if (parsed['infinite_rDead']) {
    var v = parseInt(parsed['infinite_rDead']);
    document.getElementById('sDz').value = v;
  }
  if (parsed['infinite_r1']) {
    var v = parseInt(parsed['infinite_r1']);
    document.getElementById('sR1').value = v;
  }
  if (parsed['infinite_r2']) {
    var v = parseInt(parsed['infinite_r2']);
    document.getElementById('sR2').value = v;
  }
  for (var si = 0; si < 8; si++) {
    var key = 'infinite_sector_' + si + '_color';
    if (parsed[key]) {
      var c = '#' + parsed[key];
      if (/^#[0-9a-fA-F]{6}$/.test(c)) g_sectorColors[si] = c;
    }
  }
  var total = totalSlots();
  for (var i = 0; i < total; i++) {
    var pref = 'infinite_' + i;
    var d = {};
    if (parsed[pref + '_name']) d.name = parsed[pref + '_name'];
    if (parsed[pref + '_effect']) d.effect = parsed[pref + '_effect'];
    if (parsed[pref + '_hotkey']) d.hotkey = parsed[pref + '_hotkey'];
    if (parsed[pref + '_icon']) d.icon = parsed[pref + '_icon'];
    if (parsed[pref + '_fontSize']) d.fontSize = parseInt(parsed[pref + '_fontSize']) || 100;
    if (parsed[pref + '_iconSize']) d.iconSize = parseInt(parsed[pref + '_iconSize']) || 80;
    if (parsed[pref + '_actionType']) d.actionType = parseInt(parsed[pref + '_actionType']) || 0;
    if (Object.keys(d).length > 0) g_slotData[i] = d;
  }
}

function collectSettings() {
  var lines = [];
  lines.push('infinite_sectors=' + parseInt(document.getElementById('splitSectors').value));
  lines.push('infinite_split_R2=' + document.getElementById('splitR2').value);
  lines.push('infinite_split_R3=' + parseInt(document.getElementById('splitR3').value));
  lines.push('infinite_rDead=' + parseInt(document.getElementById('sDz').value));
  lines.push('infinite_r1=' + parseInt(document.getElementById('sR1').value));
  lines.push('infinite_r2=' + parseInt(document.getElementById('sR2').value));
  for (var si = 0; si < 8; si++) {
    lines.push('infinite_sector_' + si + '_color=' + g_sectorColors[si].replace('#', ''));
  }
  var total = totalSlots();
  for (var i = 0; i < total; i++) {
    var d = g_slotData[i];
    if (d) {
      if (d.name) lines.push('infinite_' + i + '_name=' + d.name);
      if (d.effect) lines.push('infinite_' + i + '_effect=' + d.effect);
      if (d.hotkey) lines.push('infinite_' + i + '_hotkey=' + d.hotkey);
      if (d.icon) lines.push('infinite_' + i + '_icon=' + d.icon);
      if (d.fontSize && d.fontSize !== 100) lines.push('infinite_' + i + '_fontSize=' + d.fontSize);
      if (d.iconSize && d.iconSize !== 80) lines.push('infinite_' + i + '_iconSize=' + d.iconSize);
      if (d.actionType) lines.push('infinite_' + i + '_actionType=' + d.actionType);
    }
  }
  return lines.join('\n');
}

function saveSettings() {
  var data = collectSettings();
  evalScript('writeSettings(' + JSON.stringify(data) + ')').then(function(r) {
    var st = document.getElementById('statusText');
    if (r === 'OK') { st.textContent = '已保存！'; st.style.color = '#5c5'; setTimeout(function(){st.textContent='';},3000); }
    else { st.textContent = '保存失败'; st.style.color = '#c55'; }
  });
}

function loadSettings() {
  evalScript('readSettings()').then(function(data) {
    if (data) {
      applySettingsFromData(data);
      buildColorGrid();
      renderWheel();
    }
  });
}

// Canvas events
var canvas=document.getElementById('wheelCanvas');
canvas.addEventListener('mousemove',function(e){
  if(!g_preview){g_hoveredSlot=-1;g_hoveredSector=-1;return;}
  var rect=canvas.getBoundingClientRect(),mx=(e.clientX-rect.left)*canvas.width/rect.width,my=(e.clientY-rect.top)*canvas.height/rect.height;
  var hit=hitTest(mx,my);
  if(hit){g_hoveredSlot=hit.slot;g_hoveredSector=hit.sector;canvas.style.cursor='pointer';
    document.getElementById('hoverDetail').innerHTML='槽位 '+(hit.slot+1)+' — 扇区 <span style="color:'+g_sectorColors[hit.sector]+'">'+(hit.sector+1)+'</span>';}
  else{g_hoveredSlot=-1;g_hoveredSector=-1;canvas.style.cursor='default';document.getElementById('hoverDetail').textContent='移入轮盘查看';}
  renderWheel();
});
canvas.addEventListener('mouseleave',function(){g_hoveredSlot=-1;g_hoveredSector=-1;if(g_preview)renderWheel();});
canvas.addEventListener('click',function(e){
  var rect=canvas.getBoundingClientRect(),mx=(e.clientX-rect.left)*canvas.width/rect.width,my=(e.clientY-rect.top)*canvas.height/rect.height;
  var hit=hitTest(mx,my);
  if(hit){g_selectedSlot=hit.slot;var d=g_slotData[hit.slot]||{};
    document.getElementById('modalTitle').textContent='槽位 '+(hit.slot+1)+'（扇区 '+(hit.sector+1)+'）';
    document.getElementById('editName').value=d.name||'';
    document.getElementById('editEffect').value=d.effect||'';
    document.getElementById('editHotkey').value=d.hotkey||'';
    document.getElementById('editIcon').value=d.icon||'';
    document.getElementById('editFontSize').value=d.fontSize||100;
    document.getElementById('vFont').textContent=(d.fontSize||100)+'%';
    document.getElementById('editIconSize').value=d.iconSize||80;
    document.getElementById('vIconSize').textContent=(d.iconSize||80)+'%';
    document.getElementById('editAction').value=d.actionType||0;
    var ip=document.getElementById('editIconPreview');
    if(d.icon){ip.innerHTML='<img src="'+d.icon+'" onerror="this.parentElement.textContent=\'?\'" style="max-width:100%;max-height:100%;">';}else{ip.textContent='?';}
    document.getElementById('editModal').style.display='flex';}
});

document.getElementById('splitSectors').addEventListener('change',function(){g_nSectors=parseInt(this.value);buildColorGrid();renderWheel();});
['sDz','sR1','sR2'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){renderWheel();});});
document.getElementById('previewToggle').addEventListener('change',function(){g_preview=this.checked;if(!g_preview){g_hoveredSlot=-1;g_hoveredSector=-1;}renderWheel();});
document.getElementById('splitR2').addEventListener('change',function(){g_splitR2=this.value;renderWheel();});
document.getElementById('splitR3').addEventListener('change',function(){g_splitR3=parseInt(this.value);renderWheel();});

document.getElementById('modalClose').addEventListener('click',function(){document.getElementById('editModal').style.display='none';});
document.getElementById('modalCancel').addEventListener('click',function(){document.getElementById('editModal').style.display='none';});
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)this.style.display='none';});
document.getElementById('modalSave').addEventListener('click',function(){
  if(g_selectedSlot>=0){var d=g_slotData[g_selectedSlot]||{};d.name=document.getElementById('editName').value.trim();
    d.effect=document.getElementById('editEffect').value.trim();d.hotkey=document.getElementById('editHotkey').value;
    d.icon=document.getElementById('editIcon').value;
    d.fontSize=parseInt(document.getElementById('editFontSize').value)||100;
    d.iconSize=parseInt(document.getElementById('editIconSize').value)||80;
    d.actionType=parseInt(document.getElementById('editAction').value)||0;
    g_slotData[g_selectedSlot]=d;}
  document.getElementById('editModal').style.display='none';renderWheel();});

document.getElementById('editHotkeyRec').addEventListener('click',function(){
  if(g_recording)return;g_recording=true;var input=document.getElementById('editHotkey');input.value='...';
  var h=function(e){e.preventDefault();var k=e.keyCode||e.which;var m=[];
    if(e.altKey)m.push('Alt');if(e.ctrlKey)m.push('Ctrl');if(e.shiftKey)m.push('Shift');
    input.value=(m.length?m.join('+')+' + ':'')+({32:'Space',9:'Tab',13:'Enter',27:'Esc'}[k]||String.fromCharCode(k).toUpperCase()||'VK_'+k);
    document.removeEventListener('keydown',h);g_recording=false;};
  document.addEventListener('keydown',h);setTimeout(function(){if(g_recording)g_recording=false;},5000);
});
document.getElementById('editHotkeyClear').addEventListener('click',function(){document.getElementById('editHotkey').value='';});

document.getElementById('editFontSize').addEventListener('input',function(){document.getElementById('vFont').textContent=this.value+'%';});
document.getElementById('editIconSize').addEventListener('input',function(){document.getElementById('vIconSize').textContent=this.value+'%';});

document.getElementById('editIcon').addEventListener('input',function(){
  var ip=document.getElementById('editIconPreview');
  if(this.value.trim()){ip.innerHTML='<img src="'+this.value.trim()+'" onerror="this.parentElement.textContent=\'?\'" style="max-width:100%;max-height:100%;">';}else{ip.textContent='?';}
});

// Effect search
document.getElementById('editEffect').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase(),res=document.getElementById('effectResults');
  if(!q){
    if(recentEffects.length>0){
      res.innerHTML='<div style="padding:3px 8px;font-size:9px;color:#666;border-bottom:1px solid #333;">最近使用</div>'+
        recentEffects.map(function(r){return '<div class="effect-item" data-name="'+r.name+'" data-match="'+r.match+'">'+r.name+' <span class="match">'+r.match+'</span></div>';}).join('');
      res.style.display='block';}else{res.style.display='none';}
  } else {
    var matches=allEffects.filter(function(e){return e.name.toLowerCase().indexOf(q)>=0||e.match.toLowerCase().indexOf(q)>=0;}).slice(0,25);
    if(matches.length>0){
      res.innerHTML=matches.map(function(e){return '<div class="effect-item" data-name="'+e.name+'" data-match="'+e.match+'">'+e.name+' <span class="match">'+e.match+'</span></div>';}).join('');
      res.style.display='block';}else{res.style.display='none';}
  }
});
document.getElementById('effectResults').addEventListener('click',function(e){
  var item=e.target.closest('.effect-item');
  if(item){document.getElementById('editEffect').value=item.dataset.name+' ('+item.dataset.match+')';this.style.display='none';
    var idx=recentEffects.findIndex(function(r){return r.match===item.dataset.match;});
    if(idx>=0)recentEffects.splice(idx,1);
    recentEffects.unshift({name:item.dataset.name,match:item.dataset.match});
    if(recentEffects.length>10)recentEffects.length=10;}
});
document.getElementById('editEffect').addEventListener('blur',function(){setTimeout(function(){document.getElementById('effectResults').style.display='none';},200);});
document.getElementById('editEffect').addEventListener('focus',function(){if(this.value.trim()||recentEffects.length>0)this.dispatchEvent(new Event('input'));});

// Save button
document.getElementById('saveBtn').addEventListener('click',saveSettings);

// Close button
document.getElementById('closeBtn').addEventListener('click',function(){window.close();});

// Init
buildColorGrid();
renderWheel();

// Load existing settings via CSInterface
if (g_csInterface) {
  loadSettings();
} else {
  document.getElementById('statusText').textContent = 'CSInterface 未加载，仅预览模式';
  document.getElementById('statusText').style.color = '#888';
}
</script>
</body></html>
