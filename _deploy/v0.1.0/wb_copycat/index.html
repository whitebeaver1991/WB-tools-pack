<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1e1e1e;color:#ccc;font-family:Segoe UI,sans-serif;font-size:13px;overflow:hidden;user-select:none;}
.container{padding:12px;display:flex;flex-direction:column;gap:10px;height:100vh;}
h2{font-size:15px;color:#eee;border-bottom:1px solid #333;padding-bottom:6px;margin-bottom:4px;}
.section{background:#252525;border-radius:6px;padding:10px;border:1px solid #333;}
.section-title{font-size:12px;color:#888;margin-bottom:8px;}
button{background:#2a3a5a;color:#ccc;border:1px solid #3a5a7a;border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px;transition:all .15s;}
button:hover{background:#3a4a6a;}
button.primary{background:#2a5a3a;border-color:#3a7a5a;}
button.primary:hover{background:#3a6a4a;}
button.danger{background:#5a2a2a;border-color:#7a3a3a;}
button.danger:hover{background:#6a3a3a;}
button:disabled{opacity:.4;cursor:default;}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;}
.log-box{background:#111;border:1px solid #2a2a2a;border-radius:4px;padding:8px;height:0;flex:1;overflow-y:auto;font-family:Consolas,monospace;font-size:11px;color:#888;line-height:1.6;}
.log-box .ok{color:#6a6;}
.log-box .err{color:#c66;}
.log-box .info{color:#88c;}
.status-bar{font-size:11px;color:#666;padding:4px 0;}
.status-bar .busy{color:#da3;animation:pulse .8s infinite;}
@keyframes pulse{50%{opacity:.4}}
</style>
</head>
<body>
<div class="container">
  <h2>WB CopyCat</h2>

  <div class="section">
    <div class="section-title">Step 1: Generate Test Data</div>
    <div class="btn-row">
      <button id="btnGen" class="primary">Generate Test Comp</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Step 2: Capture Current Comp</div>
    <div class="btn-row">
      <button id="btnCapture">Capture</button>
      <button id="btnPreview" disabled>Preview JSON</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Step 3: Rebuild New Comp</div>
    <div class="btn-row">
      <button id="btnRebuild" class="danger" disabled>Rebuild Clone</button>
      <button id="btnClear">Clear Captured</button>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Ready</div>
  <div class="log-box" id="logBox"></div>
</div>
<script src="CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
